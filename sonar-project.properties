# ============================================================================
# Sonar configuration for plf-es-2026-1-ti3-8966100-basta-fabric
# ----------------------------------------------------------------------------
# Run with:
#   1. Set SONAR_TOKEN (and SONAR_HOST_URL if not using SonarCloud) in your env
#   2. From the repo root:
#        sonar-scanner
#      or via pnpm without installing globally:
#        pnpm dlx sonarqube-scanner
# ============================================================================

# --- Project identity ---
# For SonarCloud, set sonar.organization to your org slug and uncomment the host line.
sonar.projectKey=basta-fabric
sonar.projectName=Basta Fabric
sonar.projectVersion=1.0
# sonar.organization=<your-sonarcloud-org-slug>
# sonar.host.url=https://sonarcloud.io

# --- What to analyze ---
sonar.sources=Codigo/basta-back/src,Codigo/basta-front/app,Codigo/basta-front/src
sonar.tests=Codigo/basta-back/test

# --- Encoding ---
sonar.sourceEncoding=UTF-8

# --- Per-language hints ---
sonar.typescript.tsconfigPath=Codigo/basta-front/tsconfig.json,Codigo/basta-back/tsconfig.json

# --- Exclusions (paths Sonar should ignore) ---
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.config.{js,ts,mjs,cjs},\
  **/postcss.config.*,\
  **/next.config.*,\
  **/eslint.config.*,\
  **/biome.json,\
  Artefatos/**,\
  Divulgacao/**,\
  Codigo/basta-back/postman/**

# Test files don't count toward duplication/coverage on the main scan
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
